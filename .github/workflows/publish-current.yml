name: Publish current platform variants

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID to fill and publish
        required: true
        type: string
      release_tag:
        description: Expected consolidated release tag
        required: true
        default: v1.3.1
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Transfer only verified current variants and publish
        run: python3 scripts/publish-current.py
