name: Shared AnoteP Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install shared runtime and headless test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth dbus-x11
      - run: python3 scripts/sync-version.py --check
      - name: File fidelity and recovery tests
        run: python3 -m unittest discover -s native/linux -p 'test_*.py' -v
      - name: Build .deb and portable archive (each below 1 MiB)
        run: python3 native/linux/build.py
      - run: python3 scripts/audit-packages.py release/AnoteP-*-linux.deb release/AnoteP-*-linux-portable.tar.xz
      - name: Verify and exercise the portable package
        run: |
          cd release
          sha256sum --check SHA256SUMS-linux.txt
          test "$(dpkg-deb --field AnoteP-*-linux.deb Architecture)" = all
          tar -xf AnoteP-*-linux-portable.tar.xz -C "$RUNNER_TEMP"
          portable=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'AnoteP-*' -print -quit)
          "$portable/anotep" --version
          cd ..
          ANOTEP_TEST_HOME="$portable" xvfb-run -a dbus-run-session -- python3 native/linux/smoke-test.py
      - name: Install and exercise .deb
        run: |
          sudo apt-get install -y ./release/AnoteP-*-linux.deb
          anotep --version
          test -f /usr/share/applications/anotep.desktop
          ANOTEP_TEST_HOME=/usr/share/anotep xvfb-run -a dbus-run-session -- python3 native/linux/smoke-test.py
          sudo apt-get remove -y anotep
          test ! -e /usr/bin/anotep
      - uses: actions/upload-artifact@v4
        with:
          name: linux-small-${{ matrix.arch }}
          path: |
            release/AnoteP-*-linux.deb
            release/AnoteP-*-linux-portable.tar.xz
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-${{ matrix.arch }}
          path: build/screenshots/linux-webkit.png
          if-no-files-found: error
