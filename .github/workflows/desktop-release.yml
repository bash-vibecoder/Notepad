name: Linux desktop packages

on:
  push:
    tags: ["linux-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            unpacked: linux-unpacked
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            unpacked: linux-arm64-unpacked
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run icons
      - run: xvfb-run -a node scripts/desktop-integration.cjs
      - run: npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never
      - run: |
          node scripts/verify-binary-arch.cjs release/*.AppImage elf ${{ matrix.arch }}
          test "$(dpkg-deb --field release/*.deb Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb -x release/*.deb "$RUNNER_TEMP/anotep-deb"
          node scripts/verify-binary-arch.cjs "$RUNNER_TEMP/anotep-deb/opt/AnoteP/anotep" elf ${{ matrix.arch }}
      - run: ANOTEP_TEST_EXECUTABLE="$PWD/release/${{ matrix.unpacked }}/anotep" xvfb-run -a node scripts/desktop-integration.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AnoteP Desktop ${{ github.ref_name }}
          files: release/*
