name: Shared AnoteP Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/sync-version.py --check
      - name: Install NSIS
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the small shared-editor host and packages
        shell: pwsh
        run: ./native/windows-webview/build.ps1 -Arch ${{ matrix.arch }}
      - name: Install in Program Files and test real WebView2 UI
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $installer = (Resolve-Path "release/AnoteP-$v-win-${{ matrix.arch }}.exe").Path
          $programFiles = if ('${{ matrix.arch }}' -eq 'x64') { $env:ProgramW6432 } else { ${env:ProgramFiles(x86)} }
          $installDir = Join-Path $programFiles 'AnoteP'
          $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$installDir/AnoteP.exe")) { throw 'Default Program Files installation failed' }
          node scripts/verify-binary-arch.cjs "$installDir/AnoteP.exe" pe ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item "$installDir/AnoteP.exe").VersionInfo.ProductVersion -ne $v) { throw 'Executable internal version mismatch' }
          python scripts/audit-packages.py --installed "$installDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Start-Process "$installDir/AnoteP.exe" -ArgumentList '--check-runtime' -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw 'The CI machine needs its system WebView2 Runtime' }
          node tests/windows-shared.cjs "$installDir/AnoteP.exe" installed-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = Join-Path $env:APPDATA 'AnoteP'
          New-Item -ItemType Directory -Force $profile | Out-Null
          Set-Content "$profile/preserve-on-uninstall.txt" 'Do not delete user recovery'
          $p = Start-Process "$installDir/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$installDir/AnoteP.exe")) { throw 'Uninstall failed' }
          if (!(Test-Path "$profile/preserve-on-uninstall.txt")) { throw 'Uninstall removed user data' }
      - name: Test the extracted portable app
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $portable = Join-Path $env:RUNNER_TEMP 'AnoteP portable'
          Expand-Archive "release/AnoteP-$v-win-${{ matrix.arch }}-portable.zip" $portable
          node scripts/verify-binary-arch.cjs "$portable/AnoteP.exe" pe ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows-shared.cjs "$portable/AnoteP.exe" portable-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit-packages.py "release/AnoteP-$v-win-${{ matrix.arch }}.exe" "release/AnoteP-$v-win-${{ matrix.arch }}-portable.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-shared-${{ matrix.arch }}
          path: release/AnoteP-*-win-${{ matrix.arch }}*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks-${{ matrix.arch }}
          path: build/screenshots/shared-*
